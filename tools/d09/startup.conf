# Throw-away VPP for D-09 measurements (tools/d09_bench.py). Separate sockets,
# shared-memory prefix and core from the lab VPP (core 3); never touches
# host-vpp-access / host-vpp-wan.
unix {
  nodaemon
  log /run/vpp-bench/vpp.log
  cli-listen /run/vpp-bench/cli.sock
  runtime-dir /run/vpp-bench
  exec /opt/bsnl-vpp-gateway/tools/d09/setup.cli
}
api-segment { prefix vppbench }
socksvr { socket-name /run/vpp-bench/api.sock }
statseg { socket-name /run/vpp-bench/stats.sock size 32M }
memory { main-heap-size 1G }
cpu { main-core 2 }
plugins {
  plugin default { disable }
  plugin acl_plugin.so { enable }
  plugin abf_plugin.so { enable }
  plugin svs_plugin.so { enable }
  plugin af_packet_plugin.so { enable }
  plugin ping_plugin.so { enable }
}
