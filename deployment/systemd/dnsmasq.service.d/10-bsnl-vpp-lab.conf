[Service]
Type=simple
ExecStart=
ExecStart=/usr/sbin/dnsmasq --keep-in-foreground --pid-file=/run/dnsmasq/dnsmasq.pid --user=dnsmasq --resolv-file=/run/dnsmasq/resolv.conf --conf-dir=/etc/dnsmasq.d,.dpkg-dist,.dpkg-old,.dpkg-new
ExecStartPost=
ExecStop=
RuntimeDirectory=dnsmasq
RuntimeDirectoryMode=0755
