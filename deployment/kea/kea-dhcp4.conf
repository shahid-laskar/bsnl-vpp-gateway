{
  "Dhcp4": {
    "interfaces-config": {"interfaces": ["br-wan"]},
    "control-socket": {"socket-type": "unix", "socket-name": "kea4-ctrl-socket"},
    "lease-database": {"type": "memfile", "name": "/var/lib/kea/kea-leases4.csv", "lfc-interval": 60},
    "valid-lifetime": 300,
    "renew-timer": 150,
    "rebind-timer": 240,
    "subnet4": [
      {
        "id": 101,
        "subnet": "10.9.101.0/24",
        "relay": {"ip-addresses": ["198.51.100.1"]},
        "pools": [{"pool": "10.9.101.5-10.9.101.105"}],
        "option-data": [
          {"name": "routers", "data": "10.9.101.1"},
          {"name": "domain-name-servers", "data": "198.51.100.2", "always-send": true},
          {"name": "v4-captive-portal", "data": "https://wifi.bsnl.co.in/portal/captive-api/", "always-send": true}
        ]
      }
    ],
    "loggers": [
      {"name": "kea-dhcp4", "output-options": [{"output": "/var/log/kea/kea-dhcp4.log"}], "severity": "INFO"}
    ]
  }
}
